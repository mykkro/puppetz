[package]
name = "puppetz_viewer"
version = "0.1.0"
edition = "2024"
description = "Puppetz: loads the jointed character GLBs (models/*/*.glb) in Bevy, animates and poses them"
publish = false
license = "MIT"

[dependencies]
bevy = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy is very slow without optimizations; optimize dependencies even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
